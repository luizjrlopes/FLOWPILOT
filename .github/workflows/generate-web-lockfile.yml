name: Generate web lockfile

on:
  push:
    branches:
      - agent/flowpilot-ci-audit
    paths:
      - '.github/workflows/generate-web-lockfile.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/flowpilot-ci-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate package-lock.json
        working-directory: apps/web
        run: npm install --package-lock-only
      - name: Commit lockfile
        run: |
          if [ -z "$(git status --porcelain -- apps/web/package-lock.json)" ]; then
            echo "package-lock.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "chore: add web package lockfile"
          git push origin HEAD:agent/flowpilot-ci-audit
