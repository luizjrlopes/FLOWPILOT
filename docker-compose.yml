services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowpilot}
      POSTGRES_USER: ${POSTGRES_USER:-flowpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowpilot}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowpilot} -d ${POSTGRES_DB:-flowpilot}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: ["flowpilot-db:/var/lib/postgresql/data"]

  rabbitmq:
    image: rabbitmq:4-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./apps/api
    env_file: .env
    command: ["python", "-m", "app.bootstrap"]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  worker:
    build: ./apps/api
    env_file: .env
    command: ["python", "-m", "app.worker"]
    depends_on:
      db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  flowpilot-db:
